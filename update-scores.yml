name: Update SEC Pick'em scores

on:
  # Runs on the actual game-day cadence instead of around the clock:
  #   - Thursday 10:30 PM Central (catches the Thursday night game)
  #   - Saturday, every 30 minutes from 12:45 PM through 11:45 PM Central
  # Offset to :15/:45 rather than :00/:30, since GitHub deprioritizes
  # scheduled runs at the top of the hour and those slots see the worst
  # delays. This is still a soft schedule, not a guarantee — GitHub can
  # push a run back further under heavy load, especially on a fall Saturday
  # afternoon when a lot of other repos are also polling on the half hour.
  #
  # All three lines assume Central time (America/Chicago) — change the
  # timezone value on all three if that's not right.
  schedule:
    - cron: "30 22 * * 4"
      timezone: "America/Chicago"
    - cron: "45 12 * * 6"
      timezone: "America/Chicago"
    - cron: "15,45 13-23 * * 6"
      timezone: "America/Chicago"
  # Lets you trigger a run manually from the Actions tab, useful for
  # testing without waiting on the schedule.
  workflow_dispatch:

# So the workflow is allowed to push its own commit back to the repo.
permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run score updater
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/update_scores.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "pickem-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Auto-update: scores as of $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

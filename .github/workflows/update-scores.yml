name: Update SEC Pick'em scores

on:
  # Two different jobs, on two different rhythms:
  #   - Game-day cadence (unchanged): Thursday 10:30 PM, Saturday every 30
  #     min from 12:45 PM to 11:45 PM, Sunday 3 AM safety net. This is about
  #     catching final scores as soon as they exist.
  #   - Daily cadence (new): once a day, Sunday through Friday, at an
  #     off-peak time. This is purely to keep kickoff times, TV, and
  #     betting lines fresh through the week \u2014 those get posted and move
  #     well before game day, so a schedule built only around game day
  #     would show stale or missing odds most of the week.
  # Offset to :15/:45 rather than :00/:30, since GitHub deprioritizes
  # scheduled runs at the top of the hour and those slots see the worst
  # delays. This is still a soft schedule, not a guarantee \u2014 GitHub can
  # push a run back further under heavy load.
  #
  # All lines assume Central time (America/Chicago) \u2014 change the
  # timezone value on all of them if that's not right.
  schedule:
    - cron: "30 22 * * 4"
      timezone: "America/Chicago"
    - cron: "45 12 * * 6"
      timezone: "America/Chicago"
    - cron: "15,45 13-23 * * 6"
      timezone: "America/Chicago"
    - cron: "0 3 * * 0"
      timezone: "America/Chicago"
    - cron: "0 4 * * 0-5"
      timezone: "America/Chicago"
  # Lets you trigger a run manually from the Actions tab, useful for
  # testing without waiting on the schedule.
  workflow_dispatch:

# So the workflow is allowed to push its own commit back to the repo.
permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run score updater
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/update_scores.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "pickem-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Auto-update: scores as of $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
